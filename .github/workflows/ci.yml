name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: join_test
          POSTGRES_USER: join
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U join"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: join_test
      POSTGRES_USER: join
      POSTGRES_PASSWORD: testpass
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "false"
      SECURE_SSL_REDIRECT: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Lint (ruff)
        run: pip install ruff==0.15.10 && ruff check .
        working-directory: backend

      - name: Security audit
        run: pip install pip-audit && pip-audit
        working-directory: backend

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run manage.py test
          coverage report --fail-under=80
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend

      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI
        working-directory: frontend

      - name: Build
        run: npm run build -- --configuration=production
        working-directory: frontend

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: join_e2e
          POSTGRES_USER: join
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U join"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Celery's broker; queued tasks are never consumed because no worker runs here.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    # Shared by the backend server and global-setup's `manage.py shell`, so both hit the same DB.
    # DEBUG raises the throttle rates the specs would otherwise exceed.
    env:
      POSTGRES_DB: join_e2e
      POSTGRES_USER: join
      POSTGRES_PASSWORD: testpass
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-e2e-secret-key
      DJANGO_DEBUG: "true"
      E2E_PYTHON: python
      NG_CLI_ANALYTICS: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Start backend
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 0.0.0.0:8000 > runserver.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health/ > /dev/null; do sleep 1; done'
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            backend/runserver.log
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: join-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: join-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
